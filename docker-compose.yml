# Rappel Compose correspondant au TD2. Compose est facultatif pour l'installation Kubernetes.
services:
  web:
    build: .
    image: demo-web:1.0
    ports:
      - "127.0.0.1:${COMPOSE_HOST_PORT:-15000}:5000"
    environment:
      DB_HOST: db
      DB_USER: app
      DB_NAME: appdb
      DB_PASS: ${DB_PASS:?DB_PASS manquant}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: appdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - data:/var/lib/postgresql/data
volumes:
  data:
