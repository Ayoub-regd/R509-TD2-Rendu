apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: r509-td2
  labels:
    app: web
    app.kubernetes.io/part-of: r509-td2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: demo-web:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASS
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
